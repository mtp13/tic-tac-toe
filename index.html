<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1528" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f6fc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tic Tac Toe" />
    <meta
      name="description"
      content="Modern Tic Tac Toe game with smart AI and 2-player modes for iPhone and Desktop."
    />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <div class="app-shell">
      <header class="top-bar">
        <div class="brand">
          <div class="brand-marks" aria-hidden="true">
            <span class="brand-x">X</span>
            <span class="brand-o">O</span>
          </div>
          <h1 class="brand-title">Tic Tac Toe</h1>
        </div>

        <div class="top-actions">
          <button
            type="button"
            id="sound-toggle"
            class="icon-btn"
            aria-label="Toggle sound effects"
            aria-pressed="true"
            title="Toggle sound effects"
          >
            <svg
              class="icon icon-sound-on"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg
              class="icon icon-sound-off"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <label class="icon-btn theme-toggle" title="Toggle light/dark theme">
            <input
              type="checkbox"
              id="theme-checkbox"
              aria-label="Toggle light theme"
            />
            <svg
              class="icon icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="icon icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </label>
        </div>
      </header>

      <section class="controls-panel" aria-label="Game settings">
        <form class="mode-form" id="settings-form">
          <fieldset class="segmented-control" aria-label="Game Mode">
            <label class="segment-option">
              <input
                type="radio"
                name="gameMode"
                value="onePlayer"
                checked
              />
              <svg
                class="segment-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <circle cx="12" cy="5" r="2"></circle>
                <path d="M12 7v4"></path>
                <line x1="8" y1="16" x2="8.01" y2="16"></line>
                <line x1="16" y1="16" x2="16.01" y2="16"></line>
              </svg>
              <span>1P vs AI</span>
            </label>
            <label class="segment-option">
              <input type="radio" name="gameMode" value="twoPlayer" />
              <svg
                class="segment-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>2 Players</span>
            </label>
          </fieldset>

          <fieldset
            class="segmented-control difficulty-control"
            aria-label="AI Difficulty"
          >
            <label class="segment-option">
              <input type="radio" name="difficulty" value="easy" />
              <span>Casual</span>
            </label>
            <label class="segment-option">
              <input type="radio" name="difficulty" value="medium" checked />
              <span>Smart</span>
            </label>
            <label class="segment-option">
              <input type="radio" name="difficulty" value="hard" />
              <span>Unbeatable</span>
            </label>
          </fieldset>
        </form>
      </section>

      <section class="scoreboard" aria-label="Scoreboard">
        <div class="score-card score-x active-turn" id="score-card-x">
          <div class="score-header">
            <span class="score-badge">X</span>
            <span class="score-label" id="label-player-x">You</span>
          </div>
          <output class="score-value" id="score-x" aria-live="polite">0</output>
        </div>

        <div class="score-card score-ties" id="score-card-ties">
          <div class="score-header">
            <span class="score-label">Draws</span>
          </div>
          <output class="score-value" id="score-ties" aria-live="polite">0</output>
        </div>

        <div class="score-card score-o" id="score-card-o">
          <div class="score-header">
            <span class="score-badge">O</span>
            <span class="score-label" id="label-player-o">AI</span>
          </div>
          <output class="score-value" id="score-o" aria-live="polite">0</output>
        </div>
      </section>

      <div class="status-banner" role="status" aria-live="polite">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <p id="status">Player X starts!</p>
      </div>

      <main class="board-stage">
        <div
          class="board"
          id="board"
          role="grid"
          aria-label="Tic Tac Toe Board"
        >
          <button
            type="button"
            class="cell"
            data-index="0"
            role="gridcell"
            aria-label="Row 1, Column 1, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="1"
            role="gridcell"
            aria-label="Row 1, Column 2, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="2"
            role="gridcell"
            aria-label="Row 1, Column 3, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="3"
            role="gridcell"
            aria-label="Row 2, Column 1, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="4"
            role="gridcell"
            aria-label="Row 2, Column 2, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="5"
            role="gridcell"
            aria-label="Row 2, Column 3, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="6"
            role="gridcell"
            aria-label="Row 3, Column 1, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="7"
            role="gridcell"
            aria-label="Row 3, Column 2, empty"
          ></button>
          <button
            type="button"
            class="cell"
            data-index="8"
            role="gridcell"
            aria-label="Row 3, Column 3, empty"
          ></button>

          <svg
            class="win-line-svg"
            id="win-line-svg"
            viewBox="0 0 300 300"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <line
              id="win-line"
              x1="0"
              y1="0"
              x2="0"
              y2="0"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </main>

      <footer class="bottom-bar">
        <button type="button" id="new-game-button" class="btn btn-primary">
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
          <span>New Round</span>
        </button>

        <button
          type="button"
          id="reset-scores-button"
          class="btn btn-secondary"
          title="Reset scoreboard to zero"
        >
          <span>Reset Scores</span>
        </button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
